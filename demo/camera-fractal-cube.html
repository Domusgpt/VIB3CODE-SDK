<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VIB3+ Camera Hypercube Mandala — Sacred Geometry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #startOverlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
      color: #fff; font-family: 'Segoe UI', sans-serif;
      transition: opacity 0.6s ease;
    }
    #startOverlay.hidden { opacity: 0; pointer-events: none; }
    #startOverlay h1 {
      font-size: clamp(24px, 5vw, 48px);
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    #startOverlay p { color: #aaa; font-size: 14px; margin-bottom: 28px; max-width: 420px; text-align: center; line-height: 1.5; }
    #startBtn {
      padding: 14px 40px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, #00ffff, #ff00ff); color: #000; font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,255,0.4); }
    .info-hud {
      position: fixed; bottom: 16px; left: 16px; z-index: 5;
      color: rgba(255,255,255,0.5); font: 12px/1.4 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <h1>Camera Hypercube Mandala</h1>
    <p>160 camera-textured cubes in hypnotic mathematical formations — golden spirals, torus knots, sacred geometry. Cubes extend from your face to infinity. 8 formations auto-morph every 20s. Slow, dreamy motion. Keys: 1-8 formations, Space pulse, Z/X zoom.</p>
    <button id="startBtn">Enter the Mandala</button>
  </div>
  <canvas id="gl"></canvas>
  <div class="info-hud">
    <div id="hud"></div>
  </div>
  <script type="module" src="./camera-fractal-cube.js"></script>
</body>
</html>
