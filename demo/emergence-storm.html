<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMERGENCE STORM - Voice Crystal Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
            touch-action: none;
        }
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .hud {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .hud-tl { top: 15px; left: 15px; }
        .hud-tr { top: 15px; right: 15px; text-align: right; }
        .hud-bc { bottom: 15px; left: 50%; transform: translateX(-50%); text-align: center; }
        .pitch-display {
            font-size: 24px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
        }
        .pattern-name {
            font-size: 14px;
            color: #f0f;
            margin-top: 5px;
            text-shadow: 0 0 10px #f0f;
        }
        .mic-status {
            font-size: 11px;
            color: #0f0;
            animation: pulse 1s infinite;
        }
        .mic-status.off { color: #f00; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .volume-bar {
            width: 100px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #ff0, #f00);
            transition: width 0.05s;
        }
        .hint {
            color: rgba(255,255,255,0.4);
            font-size: 9px;
        }
        .start-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .start-overlay h1 {
            font-size: 28px;
            letter-spacing: 8px;
            color: #0ff;
            margin-bottom: 20px;
        }
        .start-overlay p {
            color: #888;
            font-size: 12px;
            margin: 5px 0;
            text-align: center;
            max-width: 280px;
        }
        .start-btn {
            margin-top: 30px;
            padding: 20px 50px;
            font-size: 16px;
            letter-spacing: 5px;
            background: #0ff;
            border: none;
            color: #000;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="hud hud-tl">
        <div class="mic-status" id="micStatus">● MIC ACTIVE</div>
        <div class="volume-bar"><div class="volume-fill" id="volumeFill" style="width: 0%"></div></div>
    </div>

    <div class="hud hud-tr">
        <div class="pitch-display" id="pitchDisplay">--</div>
        <div class="pattern-name" id="patternName">WAITING</div>
    </div>

    <div class="hud hud-bc">
        <div class="hint">HUM OR WHISTLE TO CONTROL • TAP TO BURST</div>
    </div>

    <div class="start-overlay" id="startOverlay">
        <h1>VOICE CRYSTALS</h1>
        <p>Hum low for spirals</p>
        <p>Whistle high for crystals</p>
        <p>Hold steady for complexity</p>
        <p>Tap screen to explode</p>
        <button class="start-btn" id="startBtn">START</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // State
        const S = {
            w: 0, h: 0, cx: 0, cy: 0,
            time: 0,
            pitch: 0,
            volume: 0,
            sustain: 0,
            pattern: 0,
            targetPattern: 0,
            complexity: 1,
            particles: [],
            crystals: [],
            running: false
        };

        // Audio
        let audioCtx, analyser, micStream;
        const fftSize = 2048;
        let audioData, audioBuffer;

        // Pattern names
        const PATTERNS = [
            'VOID', 'SPIRAL', 'HELIX', 'FLOWER', 'STAR',
            'CRYSTAL', 'FRACTAL', 'MANDALA', 'INFINITY', 'NOVA'
        ];

        // Resize
        function resize() {
            const dpr = Math.min(window.devicePixelRatio, 2);
            S.w = window.innerWidth;
            S.h = window.innerHeight;
            S.cx = S.w / 2;
            S.cy = S.h / 2;
            canvas.width = S.w * dpr;
            canvas.height = S.h * dpr;
            canvas.style.width = S.w + 'px';
            canvas.style.height = S.h + 'px';
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Start mic
        async function startMic() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = fftSize;
                analyser.smoothingTimeConstant = 0.8;

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);

                audioData = new Float32Array(analyser.fftSize);
                audioBuffer = new Uint8Array(analyser.frequencyBinCount);

                document.getElementById('micStatus').textContent = '● MIC ACTIVE';
                document.getElementById('micStatus').classList.remove('off');
                return true;
            } catch (e) {
                document.getElementById('micStatus').textContent = '● MIC OFF';
                document.getElementById('micStatus').classList.add('off');
                return false;
            }
        }

        // Pitch detection (autocorrelation)
        function detectPitch() {
            if (!analyser) return 0;

            analyser.getFloatTimeDomainData(audioData);

            // RMS volume
            let rms = 0;
            for (let i = 0; i < audioData.length; i++) {
                rms += audioData[i] * audioData[i];
            }
            rms = Math.sqrt(rms / audioData.length);
            S.volume = Math.min(1, rms * 10);

            if (rms < 0.01) return 0;

            // Autocorrelation
            const size = Math.floor(audioData.length / 2);
            let maxCorr = 0;
            let maxLag = 0;

            for (let lag = 20; lag < size; lag++) {
                let corr = 0;
                for (let i = 0; i < size; i++) {
                    corr += audioData[i] * audioData[i + lag];
                }
                if (corr > maxCorr) {
                    maxCorr = corr;
                    maxLag = lag;
                }
            }

            if (maxCorr < 0.01) return 0;

            const freq = audioCtx.sampleRate / maxLag;
            return freq > 50 && freq < 2000 ? freq : 0;
        }

        // Map pitch to pattern (0-9)
        function pitchToPattern(freq) {
            if (freq < 80) return 0;      // Very low - void
            if (freq < 120) return 1;     // Low hum - spiral
            if (freq < 180) return 2;     // Low-mid - helix
            if (freq < 260) return 3;     // Mid - flower
            if (freq < 350) return 4;     // Mid-high - star
            if (freq < 500) return 5;     // High - crystal
            if (freq < 700) return 6;     // Higher - fractal
            if (freq < 1000) return 7;    // Whistle low - mandala
            if (freq < 1400) return 8;    // Whistle mid - infinity
            return 9;                      // Whistle high - nova
        }

        // Crystal particle
        class Crystal {
            constructor(x, y, angle, speed, size, hue) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = size;
                this.hue = hue;
                this.life = 1;
                this.decay = 0.005 + Math.random() * 0.01;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.sides = 3 + Math.floor(Math.random() * 4);
            }

            update(dt) {
                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.rotation += this.rotSpeed;
                this.life -= this.decay;
                return this.life > 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const alpha = this.life;
                const s = this.size * this.life;

                ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
                ctx.fillStyle = `hsla(${this.hue}, 80%, 50%, ${alpha * 0.3})`;
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                for (let i = 0; i <= this.sides; i++) {
                    const a = (i / this.sides) * Math.PI * 2;
                    const r = s * (1 + Math.sin(a * 3 + S.time * 2) * 0.2);
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        // Draw patterns based on voice
        function drawPattern() {
            const p = S.pattern;
            const c = S.complexity;
            const t = S.time;
            const hue = (t * 30 + p * 36) % 360;

            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.8)`;
            ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.1)`;
            ctx.lineWidth = 2;

            const baseSize = Math.min(S.w, S.h) * 0.3 * (0.5 + c * 0.5);
            const arms = Math.floor(3 + p * 1.5);

            ctx.save();
            ctx.translate(S.cx, S.cy);

            switch (p) {
                case 0: // Void - pulsing circle
                    drawVoid(baseSize, c, t, hue);
                    break;
                case 1: // Spiral
                    drawSpiral(baseSize, c, t, arms, hue);
                    break;
                case 2: // Helix
                    drawHelix(baseSize, c, t, hue);
                    break;
                case 3: // Flower
                    drawFlower(baseSize, c, t, arms, hue);
                    break;
                case 4: // Star
                    drawStar(baseSize, c, t, arms + 2, hue);
                    break;
                case 5: // Crystal
                    drawCrystal(baseSize, c, t, hue);
                    break;
                case 6: // Fractal
                    drawFractal(baseSize, c, t, hue, 0, 4);
                    break;
                case 7: // Mandala
                    drawMandala(baseSize, c, t, arms * 2, hue);
                    break;
                case 8: // Infinity
                    drawInfinity(baseSize, c, t, hue);
                    break;
                case 9: // Nova
                    drawNova(baseSize, c, t, hue);
                    break;
            }

            ctx.restore();
        }

        function drawVoid(size, c, t, hue) {
            for (let i = 0; i < 5; i++) {
                const r = size * (0.3 + i * 0.15) * (1 + Math.sin(t * 2 + i) * 0.1 * c);
                ctx.strokeStyle = `hsla(${hue + i * 20}, 100%, 70%, ${0.5 - i * 0.08})`;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawSpiral(size, c, t, arms, hue) {
            const points = Math.floor(100 * c);
            for (let a = 0; a < arms; a++) {
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 4 + (a / arms) * Math.PI * 2 + t;
                    const r = (i / points) * size;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `hsla(${hue + a * 30}, 100%, 70%, 0.7)`;
                ctx.stroke();
            }
        }

        function drawHelix(size, c, t, hue) {
            const points = Math.floor(80 * c);
            for (let h = 0; h < 2; h++) {
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const p = i / points;
                    const y = (p - 0.5) * size * 2;
                    const angle = p * Math.PI * 6 + t * 2 + h * Math.PI;
                    const x = Math.cos(angle) * size * 0.4;
                    const z = Math.sin(angle) * size * 0.2;
                    if (i === 0) ctx.moveTo(x, y + z);
                    else ctx.lineTo(x, y + z);
                }
                ctx.strokeStyle = `hsla(${hue + h * 60}, 100%, 70%, 0.8)`;
                ctx.stroke();
            }
        }

        function drawFlower(size, c, t, petals, hue) {
            for (let p = 0; p < petals; p++) {
                const angle = (p / petals) * Math.PI * 2 + t * 0.5;
                ctx.save();
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);

                const petalSize = size * (0.8 + Math.sin(t * 3 + p) * 0.1 * c);
                for (let i = 0; i <= 20; i++) {
                    const a = (i / 20) * Math.PI;
                    const r = Math.sin(a) * petalSize;
                    const x = Math.cos(a) * r * 0.3;
                    const y = Math.sin(a) * r;
                    ctx.lineTo(x, y);
                }

                ctx.strokeStyle = `hsla(${hue + p * 15}, 100%, 70%, 0.7)`;
                ctx.fillStyle = `hsla(${hue + p * 15}, 80%, 50%, 0.1)`;
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawStar(size, c, t, points, hue) {
            const inner = size * 0.4;
            const outer = size * (1 + Math.sin(t * 2) * 0.1 * c);

            ctx.beginPath();
            for (let i = 0; i <= points * 2; i++) {
                const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 + t * 0.3;
                const r = i % 2 === 0 ? outer : inner;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.2)`;
            ctx.fill();
            ctx.stroke();

            // Inner star
            ctx.beginPath();
            for (let i = 0; i <= points * 2; i++) {
                const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 - t * 0.5;
                const r = i % 2 === 0 ? inner : inner * 0.4;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = `hsla(${hue + 60}, 100%, 80%, 0.9)`;
            ctx.stroke();
        }

        function drawCrystal(size, c, t, hue) {
            const facets = Math.floor(6 + c * 4);

            for (let layer = 0; layer < 3; layer++) {
                const layerSize = size * (1 - layer * 0.25);
                const rotation = t * (0.5 - layer * 0.2);

                ctx.beginPath();
                for (let i = 0; i <= facets; i++) {
                    const angle = (i / facets) * Math.PI * 2 + rotation;
                    const variance = 1 + Math.sin(angle * 3 + t * 2) * 0.15 * c;
                    const r = layerSize * variance;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();

                ctx.strokeStyle = `hsla(${hue + layer * 40}, 100%, ${80 - layer * 10}%, ${0.9 - layer * 0.2})`;
                ctx.fillStyle = `hsla(${hue + layer * 40}, 80%, 50%, ${0.1 - layer * 0.02})`;
                ctx.fill();
                ctx.stroke();

                // Radial lines
                for (let i = 0; i < facets; i++) {
                    const angle = (i / facets) * Math.PI * 2 + rotation;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * layerSize, Math.sin(angle) * layerSize);
                    ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.3)`;
                    ctx.stroke();
                }
            }
        }

        function drawFractal(size, c, t, hue, depth, maxDepth) {
            if (depth >= maxDepth || size < 5) return;

            const sides = 3;
            ctx.beginPath();
            for (let i = 0; i <= sides; i++) {
                const angle = (i / sides) * Math.PI * 2 - Math.PI / 2 + t * 0.2 * (depth + 1);
                const x = Math.cos(angle) * size;
                const y = Math.sin(angle) * size;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = `hsla(${hue + depth * 30}, 100%, ${70 - depth * 10}%, ${0.8 - depth * 0.15})`;
            ctx.stroke();

            // Recurse
            const nextSize = size * 0.5;
            for (let i = 0; i < sides; i++) {
                const angle = (i / sides) * Math.PI * 2 - Math.PI / 2 + t * 0.2 * (depth + 1);
                const x = Math.cos(angle) * size * 0.6;
                const y = Math.sin(angle) * size * 0.6;
                ctx.save();
                ctx.translate(x, y);
                drawFractal(nextSize, c, t, hue, depth + 1, maxDepth);
                ctx.restore();
            }
        }

        function drawMandala(size, c, t, segments, hue) {
            for (let ring = 0; ring < 4; ring++) {
                const ringSize = size * (0.3 + ring * 0.25);
                const ringSegments = segments + ring * 2;

                for (let i = 0; i < ringSegments; i++) {
                    const angle = (i / ringSegments) * Math.PI * 2 + t * (0.3 - ring * 0.1);

                    ctx.save();
                    ctx.rotate(angle);
                    ctx.translate(ringSize, 0);

                    // Draw petal/element
                    const elemSize = size * 0.1 * (1 + Math.sin(t * 2 + i + ring) * 0.3 * c);
                    ctx.beginPath();
                    ctx.arc(0, 0, elemSize, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue + ring * 25 + i * 5}, 100%, 70%, 0.7)`;
                    ctx.stroke();

                    ctx.restore();
                }
            }
        }

        function drawInfinity(size, c, t, hue) {
            const points = Math.floor(100 * c);

            ctx.beginPath();
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const scale = Math.sin(angle) * size;
                const x = scale * Math.cos(t * 0.5);
                const y = Math.sin(angle * 2) * size * 0.5;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.8)`;
            ctx.stroke();

            // Second loop
            ctx.beginPath();
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const scale = Math.sin(angle) * size * 0.6;
                const x = scale * Math.cos(t * 0.5 + Math.PI);
                const y = Math.sin(angle * 2 + Math.PI) * size * 0.3;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `hsla(${hue + 60}, 100%, 70%, 0.6)`;
            ctx.stroke();
        }

        function drawNova(size, c, t, hue) {
            const rays = Math.floor(12 + c * 12);

            for (let i = 0; i < rays; i++) {
                const angle = (i / rays) * Math.PI * 2 + t;
                const length = size * (0.5 + Math.sin(t * 5 + i * 0.5) * 0.5 * c);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
                ctx.strokeStyle = `hsla(${hue + i * 5}, 100%, ${60 + Math.sin(t * 3 + i) * 20}%, 0.8)`;
                ctx.lineWidth = 2 + Math.sin(t * 4 + i) * 1;
                ctx.stroke();
            }

            // Core
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.3);
            gradient.addColorStop(0, `hsla(${hue}, 100%, 90%, 0.8)`);
            gradient.addColorStop(0.5, `hsla(${hue + 30}, 100%, 60%, 0.3)`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Explosion
        function explode(x, y) {
            const count = 30 + Math.floor(S.complexity * 30);
            const hue = (S.time * 30 + S.pattern * 36) % 360;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
                const speed = 3 + Math.random() * 8;
                const size = 5 + Math.random() * 15;
                S.crystals.push(new Crystal(x, y, angle, speed, size, hue + Math.random() * 60));
            }
        }

        // Input
        function handleInput(x, y) {
            explode(x, y);
        }

        canvas.addEventListener('click', e => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Main loop
        let lastTime = 0;

        function loop(timestamp) {
            requestAnimationFrame(loop);

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (!S.running) return;

            S.time += dt;

            // Audio processing
            const pitch = detectPitch();
            if (pitch > 0) {
                S.pitch = S.pitch * 0.8 + pitch * 0.2;
                S.targetPattern = pitchToPattern(S.pitch);
                S.sustain = Math.min(1, S.sustain + dt * 2);
            } else {
                S.sustain = Math.max(0, S.sustain - dt);
            }

            // Smooth pattern transition
            S.pattern += (S.targetPattern - S.pattern) * dt * 3;

            // Complexity based on sustain and volume
            S.complexity = 0.3 + S.sustain * 0.5 + S.volume * 0.2;

            // Update UI
            document.getElementById('volumeFill').style.width = (S.volume * 100) + '%';
            document.getElementById('pitchDisplay').textContent = pitch > 0 ? Math.round(S.pitch) + ' Hz' : '--';
            document.getElementById('patternName').textContent = PATTERNS[Math.round(S.pattern)];

            // Clear with fade
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, S.w, S.h);

            // Draw pattern
            drawPattern();

            // Update and draw crystals
            S.crystals = S.crystals.filter(c => {
                if (c.update(dt)) {
                    c.draw();
                    return true;
                }
                return false;
            });
        }

        // Start
        document.getElementById('startBtn').addEventListener('click', async () => {
            await startMic();
            document.getElementById('startOverlay').classList.add('hidden');
            S.running = true;
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
