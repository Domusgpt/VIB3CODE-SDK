<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VIB3+ Camera Fractal Cube — Vortex Funnel</title>
  <meta name="description" content="Fixed camera looking into a fractal tornado. Center cube at back with 4 spiral arms emerging toward viewer, scaled by the plastic ratio." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #startOverlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
      color: #fff; font-family: 'Segoe UI', sans-serif;
      transition: opacity 0.6s ease;
    }
    #startOverlay.hidden { opacity: 0; pointer-events: none; }
    #startOverlay h1 {
      font-size: clamp(24px, 5vw, 48px);
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    #startOverlay p { color: #aaa; font-size: 14px; margin-bottom: 28px; max-width: 420px; text-align: center; line-height: 1.5; }
    #startBtn {
      padding: 14px 40px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, #00ffff, #ff00ff); color: #000; font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,255,0.4); }
    .info-hud {
      position: fixed; bottom: 16px; left: 16px; z-index: 5;
      color: rgba(255,255,255,0.5); font: 12px/1.4 monospace;
      pointer-events: none;
    }
    .back-link {
      position: fixed; top: 10px; left: 16px; z-index: 20;
      font: 500 11px/1 'SF Mono','Fira Code','Consolas',monospace;
      color: #5b9cf5; text-decoration: none; opacity: 0.7;
      transition: opacity .2s; pointer-events: auto;
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Gallery</a>
  <div id="startOverlay">
    <h1>Camera Fractal Cube</h1>
    <p>Fixed camera looking into a fractal tornado. 4 spiral arms emerge from the center cube toward you, each scaled by the plastic ratio. Camera permission required.</p>
    <button id="startBtn">Start Demo</button>
  </div>
  <canvas id="gl"></canvas>
  <div class="info-hud">
    <div id="hud"></div>
  </div>
  <script>
    const canvas = document.getElementById('gl');
    const overlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const supportsWebGL2 = !!canvas.getContext('webgl2');

    if (!supportsWebGL2) {
      startBtn.style.display = 'none';
      overlay.querySelector('p').textContent =
        'WebGL 2 is not available on this device. Showing a lightweight fallback preview.';

      const ctx = canvas.getContext('2d');
      const resize = () => {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      addEventListener('resize', resize);
      resize();

      const draw = (t) => {
        const w = innerWidth;
        const h = innerHeight;
        ctx.clearRect(0, 0, w, h);
        const grd = ctx.createRadialGradient(w * 0.5, h * 0.5, 10, w * 0.5, h * 0.5, Math.max(w, h));
        grd.addColorStop(0, '#101020');
        grd.addColorStop(1, '#030308');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(0,255,255,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < 120; i++) {
          const a = i * 0.25 + t * 0.0003;
          const r = 20 + i * 3;
          const x = w * 0.5 + Math.cos(a) * r;
          const y = h * 0.5 + Math.sin(a) * r * 0.6;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
    } else {
      overlay.querySelector('p').textContent =
        'Fixed camera looking into a fractal tornado. Tap Start to enable the camera feed.';
      import('../camera-fractal-cube.js');
    }
  </script>
</body>
</html>
