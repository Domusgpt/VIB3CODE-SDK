name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build demo (vite)
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Assemble site
        run: |
          mkdir -p _site

          # Landing page
          cp pages-index.html _site/index.html

          # Bundled PCG / Gaussian splat demo
          cp -r dist/demo   _site/demo/
          cp -r dist/assets _site/assets/

          # Full SDK app (inline JS, no build needed)
          cp -r sdk _site/sdk

          # Docs / gallery
          cp -r docs _site/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
