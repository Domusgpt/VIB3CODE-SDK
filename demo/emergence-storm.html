<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOICE CRYSTALS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .hud {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }
        .top-bar {
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .pitch-display {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px currentColor;
        }
        .pattern-name {
            font-size: 18px;
            font-weight: 700;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
        }
        .mic-indicator {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
            animation: blink 1s infinite;
        }
        .mic-indicator.off { background: #f00; box-shadow: 0 0 10px #f00; animation: none; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .bottom-bar {
            bottom: 0; left: 0; right: 0;
            padding: 20px;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .hint { color: rgba(255,255,255,0.5); font-size: 12px; }
        .start-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .start-screen.hidden { display: none; }
        .start-screen h1 {
            font-size: 36px;
            font-weight: 900;
            color: #0ff;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .start-screen p {
            color: #888;
            font-size: 14px;
            margin: 8px 0;
        }
        .start-screen p strong { color: #fff; }
        .start-btn {
            margin-top: 40px;
            padding: 18px 60px;
            font-size: 18px;
            font-weight: 700;
            background: #0ff;
            border: none;
            color: #000;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="hud top-bar">
        <div>
            <div class="pattern-name" id="pattern">READY</div>
        </div>
        <div style="text-align: right;">
            <div class="pitch-display" id="pitch">--</div>
            <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 5px;">
                <span style="font-size: 11px; color: #888;">MIC</span>
                <div class="mic-indicator" id="mic"></div>
            </div>
        </div>
    </div>

    <div class="hud bottom-bar">
        <div class="hint">HUM LOW → SPIRALS • WHISTLE HIGH → CRYSTALS • TAP → BURST</div>
    </div>

    <div class="start-screen" id="start">
        <h1>VOICE CRYSTALS</h1>
        <p><strong>Hum low</strong> for spirals and waves</p>
        <p><strong>Hum mid</strong> for flowers and stars</p>
        <p><strong>Whistle high</strong> for crystals and fractals</p>
        <p><strong>Hold steady</strong> for more detail</p>
        <p><strong>Tap screen</strong> to explode</p>
        <button class="start-btn" id="go">START</button>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: false });

        let W, H, CX, CY;
        let running = false;
        let time = 0;

        // Audio
        let audioCtx, analyser, audioData;
        let pitch = 0, smoothPitch = 0, volume = 0, sustain = 0;

        // Pattern
        let pattern = 0, targetPattern = 0;
        const PATTERNS = ['VOID', 'WAVE', 'SPIRAL', 'FLOWER', 'STAR', 'CRYSTAL', 'FRACTAL', 'MANDALA', 'BURST'];

        // Particles for tap explosions
        let particles = [];

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            CX = W / 2;
            CY = H / 2;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = false;
        }

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.5;

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                audioCtx.createMediaStreamSource(stream).connect(analyser);
                audioData = new Float32Array(analyser.fftSize);

                document.getElementById('mic').classList.remove('off');
                return true;
            } catch(e) {
                document.getElementById('mic').classList.add('off');
                return false;
            }
        }

        function getPitch() {
            if (!analyser) return 0;
            analyser.getFloatTimeDomainData(audioData);

            // Volume
            let sum = 0;
            for (let i = 0; i < audioData.length; i++) sum += audioData[i] * audioData[i];
            volume = Math.sqrt(sum / audioData.length) * 8;
            if (volume < 0.05) return 0;

            // Autocorrelation pitch detection
            const len = audioData.length / 2;
            let best = 0, bestLag = 0;
            for (let lag = 30; lag < len; lag++) {
                let c = 0;
                for (let i = 0; i < len; i++) c += audioData[i] * audioData[i + lag];
                if (c > best) { best = c; bestLag = lag; }
            }
            if (best < 0.1) return 0;

            const f = audioCtx.sampleRate / bestLag;
            return (f > 60 && f < 1500) ? f : 0;
        }

        function pitchToPattern(f) {
            if (f < 90) return 0;
            if (f < 130) return 1;
            if (f < 180) return 2;
            if (f < 250) return 3;
            if (f < 350) return 4;
            if (f < 500) return 5;
            if (f < 800) return 6;
            if (f < 1200) return 7;
            return 8;
        }

        function hsl(h, s, l) {
            return `hsl(${h % 360}, ${s}%, ${l}%)`;
        }

        // Sharp geometric drawing functions
        function drawVoid(size, t, hue) {
            for (let i = 0; i < 6; i++) {
                const r = size * (0.2 + i * 0.15);
                ctx.strokeStyle = hsl(hue + i * 15, 100, 60);
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(CX, CY, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawWave(size, t, hue, complexity) {
            const waves = 3;
            for (let w = 0; w < waves; w++) {
                ctx.strokeStyle = hsl(hue + w * 40, 100, 60);
                ctx.lineWidth = 4;
                ctx.beginPath();
                const pts = Math.floor(50 * complexity);
                for (let i = 0; i <= pts; i++) {
                    const x = (i / pts) * W;
                    const y = CY + Math.sin((i / pts) * Math.PI * 4 + t * 2 + w) * size * 0.5
                            + Math.sin((i / pts) * Math.PI * 8 + t * 3) * size * 0.2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function drawSpiral(size, t, hue, complexity) {
            const arms = 4;
            const pts = Math.floor(80 * complexity);
            for (let a = 0; a < arms; a++) {
                ctx.strokeStyle = hsl(hue + a * 30, 100, 60);
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < pts; i++) {
                    const angle = (i / pts) * Math.PI * 6 + (a / arms) * Math.PI * 2 + t;
                    const r = (i / pts) * size;
                    const x = CX + Math.cos(angle) * r;
                    const y = CY + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function drawFlower(size, t, hue, complexity) {
            const petals = Math.floor(6 + complexity * 6);
            for (let p = 0; p < petals; p++) {
                const angle = (p / petals) * Math.PI * 2 + t * 0.3;
                ctx.save();
                ctx.translate(CX, CY);
                ctx.rotate(angle);

                ctx.strokeStyle = hsl(hue + p * 10, 100, 60);
                ctx.fillStyle = hsl(hue + p * 10, 80, 40);
                ctx.lineWidth = 2;

                ctx.beginPath();
                const petalLen = size * 0.8;
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(petalLen * 0.3, -petalLen * 0.3, 0, -petalLen);
                ctx.quadraticCurveTo(-petalLen * 0.3, -petalLen * 0.3, 0, 0);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            // Center
            ctx.fillStyle = hsl(hue + 60, 100, 70);
            ctx.beginPath();
            ctx.arc(CX, CY, size * 0.15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawStar(size, t, hue, complexity) {
            const points = Math.floor(5 + complexity * 4);
            const inner = size * 0.4;
            const outer = size;

            ctx.strokeStyle = hsl(hue, 100, 70);
            ctx.fillStyle = hsl(hue, 80, 30);
            ctx.lineWidth = 3;

            ctx.beginPath();
            for (let i = 0; i <= points * 2; i++) {
                const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 + t * 0.2;
                const r = i % 2 === 0 ? outer : inner;
                const x = CX + Math.cos(angle) * r;
                const y = CY + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner star
            ctx.strokeStyle = hsl(hue + 60, 100, 80);
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= points * 2; i++) {
                const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 - t * 0.3;
                const r = i % 2 === 0 ? inner * 0.8 : inner * 0.3;
                const x = CX + Math.cos(angle) * r;
                const y = CY + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        function drawCrystal(size, t, hue, complexity) {
            const facets = Math.floor(6 + complexity * 4);

            for (let layer = 0; layer < 3; layer++) {
                const s = size * (1 - layer * 0.3);
                const rot = t * (0.4 - layer * 0.15);

                ctx.strokeStyle = hsl(hue + layer * 30, 100, 70 - layer * 10);
                ctx.lineWidth = 4 - layer;

                ctx.beginPath();
                for (let i = 0; i <= facets; i++) {
                    const angle = (i / facets) * Math.PI * 2 + rot;
                    const x = CX + Math.cos(angle) * s;
                    const y = CY + Math.sin(angle) * s;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();

                // Radial lines from center
                if (layer === 0) {
                    ctx.strokeStyle = hsl(hue, 100, 50);
                    ctx.lineWidth = 1;
                    for (let i = 0; i < facets; i++) {
                        const angle = (i / facets) * Math.PI * 2 + rot;
                        ctx.beginPath();
                        ctx.moveTo(CX, CY);
                        ctx.lineTo(CX + Math.cos(angle) * s, CY + Math.sin(angle) * s);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawFractal(size, t, hue, complexity, depth, maxDepth, x, y) {
            if (depth > maxDepth) return;

            const sides = 3;
            ctx.strokeStyle = hsl(hue + depth * 40, 100, 70 - depth * 15);
            ctx.lineWidth = Math.max(1, 3 - depth);

            ctx.beginPath();
            for (let i = 0; i <= sides; i++) {
                const angle = (i / sides) * Math.PI * 2 - Math.PI / 2 + t * 0.2;
                const px = x + Math.cos(angle) * size;
                const py = y + Math.sin(angle) * size;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            if (depth < maxDepth) {
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * Math.PI * 2 - Math.PI / 2 + t * 0.2;
                    const nx = x + Math.cos(angle) * size * 0.6;
                    const ny = y + Math.sin(angle) * size * 0.6;
                    drawFractal(size * 0.45, t, hue, complexity, depth + 1, maxDepth, nx, ny);
                }
            }
        }

        function drawMandala(size, t, hue, complexity) {
            const rings = 4;
            const segments = Math.floor(8 + complexity * 8);

            for (let ring = 0; ring < rings; ring++) {
                const r = size * (0.25 + ring * 0.25);
                const segs = segments + ring * 4;

                for (let i = 0; i < segs; i++) {
                    const angle = (i / segs) * Math.PI * 2 + t * (0.3 - ring * 0.08);

                    ctx.save();
                    ctx.translate(CX, CY);
                    ctx.rotate(angle);
                    ctx.translate(r, 0);

                    // Draw element
                    const elemSize = size * 0.08 * (1 + Math.sin(t * 2 + i) * 0.3);
                    ctx.strokeStyle = hsl(hue + ring * 25 + i * 3, 100, 65);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, elemSize, 0, Math.PI * 2);
                    ctx.stroke();

                    // Connecting lines
                    if (ring > 0) {
                        ctx.strokeStyle = hsl(hue + ring * 25, 60, 40);
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(-size * 0.25, 0);
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            }
        }

        function drawBurst(size, t, hue, complexity) {
            const rays = Math.floor(16 + complexity * 16);

            for (let i = 0; i < rays; i++) {
                const angle = (i / rays) * Math.PI * 2 + t;
                const len = size * (0.4 + Math.sin(t * 5 + i * 0.3) * 0.6);

                ctx.strokeStyle = hsl(hue + i * 3, 100, 60 + Math.sin(t * 3 + i) * 20);
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(CX + Math.cos(angle) * len, CY + Math.sin(angle) * len);
                ctx.stroke();
            }

            // Core glow
            const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, size * 0.3);
            grad.addColorStop(0, hsl(hue, 100, 90));
            grad.addColorStop(0.5, hsl(hue + 30, 100, 50));
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(CX, CY, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Particle class for explosions
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = 4 + Math.random() * 8;
                this.hue = hue + Math.random() * 40;
                this.life = 1;
                this.sides = 3 + Math.floor(Math.random() * 4);
            }

            update(dt) {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.life -= 0.02;
                return this.life > 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(time * 3);

                ctx.strokeStyle = hsl(this.hue, 100, 70);
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i <= this.sides; i++) {
                    const angle = (i / this.sides) * Math.PI * 2;
                    const r = this.size * this.life;
                    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        function explode(x, y) {
            const hue = (time * 50 + pattern * 40) % 360;
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, hue));
            }
        }

        function update(dt) {
            time += dt;

            // Audio
            const p = getPitch();
            if (p > 0) {
                smoothPitch = smoothPitch * 0.7 + p * 0.3;
                targetPattern = pitchToPattern(smoothPitch);
                sustain = Math.min(1, sustain + dt * 3);
            } else {
                sustain = Math.max(0, sustain - dt * 1.5);
            }

            pattern += (targetPattern - pattern) * dt * 4;

            const complexity = 0.5 + sustain * 0.5;

            // Update UI
            document.getElementById('pitch').textContent = p > 0 ? Math.round(smoothPitch) + ' Hz' : '--';
            document.getElementById('pattern').textContent = PATTERNS[Math.round(pattern)];

            // Clear - SOLID BLACK, no transparency
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            // Draw pattern
            const size = Math.min(W, H) * 0.35;
            const hue = (time * 20 + pattern * 40) % 360;
            const idx = Math.round(pattern);

            switch(idx) {
                case 0: drawVoid(size, time, hue); break;
                case 1: drawWave(size, time, hue, complexity); break;
                case 2: drawSpiral(size, time, hue, complexity); break;
                case 3: drawFlower(size, time, hue, complexity); break;
                case 4: drawStar(size, time, hue, complexity); break;
                case 5: drawCrystal(size, time, hue, complexity); break;
                case 6: drawFractal(size * 0.8, time, hue, complexity, 0, Math.floor(2 + complexity * 2), CX, CY); break;
                case 7: drawMandala(size, time, hue, complexity); break;
                case 8: drawBurst(size, time, hue, complexity); break;
            }

            // Update particles
            particles = particles.filter(p => {
                if (p.update(dt)) {
                    p.draw();
                    return true;
                }
                return false;
            });
        }

        let lastTime = 0;
        function loop(ts) {
            if (!running) return;
            requestAnimationFrame(loop);
            const dt = Math.min((ts - lastTime) / 1000, 0.1);
            lastTime = ts;
            update(dt);
        }

        // Events
        window.addEventListener('resize', resize);

        canvas.addEventListener('click', e => explode(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            explode(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        document.getElementById('go').addEventListener('click', async () => {
            await initAudio();
            document.getElementById('start').classList.add('hidden');
            running = true;
            requestAnimationFrame(loop);
        });

        // Init
        resize();
        document.getElementById('mic').classList.add('off');
    })();
    </script>
</body>
</html>
