<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ChromaWar — Emergent Particle Warfare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0812;overflow:hidden;font-family:'Courier New',monospace;color:#ddd;touch-action:none}
canvas{width:100vw;height:100vh;display:block;cursor:crosshair}
.hud{position:fixed;z-index:10;pointer-events:none}
#balance-bar{position:fixed;top:0;left:0;right:0;height:6px;display:flex;z-index:20}
#bar-red{background:#ff2820;height:100%;width:33.3%;transition:width .3s}
#bar-yellow{background:#ffd910;height:100%;width:33.3%;transition:width .3s}
#bar-blue{background:#2868ff;height:100%;width:33.3%;transition:width .3s}
#stats-panel{position:fixed;top:14px;left:12px;background:rgba(10,8,18,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 14px;font-size:11px;line-height:1.6;z-index:15}
#stats{opacity:.7}
#mode-stats{opacity:.5;font-size:10px;margin-top:2px}
#score-panel{position:fixed;top:14px;right:12px;background:rgba(10,8,18,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 14px;font-size:13px;text-align:right;z-index:15}
#score{font-size:18px;font-weight:bold;color:#0ff}
#line-count{opacity:.7;font-size:11px}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:bold;text-shadow:0 0 20px rgba(0,255,255,.5);z-index:15;opacity:.6;transition:opacity .5s;pointer-events:none}
#instructions{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,8,18,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 16px;font-size:11px;opacity:.5;z-index:15;text-align:center;pointer-events:none}
#error-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,0,0,.15);border:1px solid red;border-radius:8px;padding:20px;max-width:80%;z-index:100;display:none;font-size:12px;word-break:break-all}
.color-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot-red{background:#ff2820}.dot-yellow{background:#ffd910}.dot-blue{background:#2868ff}
</style>
</head>
<body>
<canvas id="chromawar-canvas"></canvas>

<div id="balance-bar">
  <div id="bar-red"></div>
  <div id="bar-yellow"></div>
  <div id="bar-blue"></div>
</div>

<div id="stats-panel" class="hud">
  <div style="font-size:14px;font-weight:bold;margin-bottom:4px;color:#0ff">CHROMAWAR</div>
  <div id="stats">Initializing...</div>
  <div id="mode-stats"></div>
  <div style="margin-top:4px;font-size:10px;opacity:.5">
    <span class="color-dot dot-red"></span>Red
    <span class="color-dot dot-yellow" style="margin-left:6px"></span>Yellow
    <span class="color-dot dot-blue" style="margin-left:6px"></span>Blue
  </div>
</div>

<div id="score-panel" class="hud">
  <div id="score">Score: 0</div>
  <div id="line-count">Lines: 0 / 3</div>
</div>

<div id="message">Balance: 0%</div>

<div id="instructions">
  Draw lines (click + drag) to create barriers · Max 3 lines · 8s duration · Goal: balance all colours
</div>

<div id="error-box"></div>

<script type="module" src="chromawar-demo.js"></script>
</body>
</html>
